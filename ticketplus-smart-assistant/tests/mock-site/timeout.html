<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="tpsa-mock-site" content="ticketplus">
<title>2026 星光巡迴演唱會 台北站 | Ticket Plus遠大售票系統（模擬）</title>
<link rel="stylesheet" href="mock.css"></head>
<body><header>Ticket Plus 遠大售票（測試用模擬網站，非官方）</header>
<main>
<h1 class="event-title">2026 星光巡迴演唱會 台北站</h1>
<p>2026/12/20(六) 19:30｜台北小巨蛋｜每筆限購 4 張</p>
<div class="steps"><span>1 選擇票券</span><span>2 確認訂單</span><span>3 結帳</span></div>
  <div class="price-group">
    <div class="group-title">VIP區 NT$6,800</div>
    <div class="rows">
      <div class="ticket-row"><div class="area-name">VIP A區 全票</div><div class="status">剩餘 12</div><div class="counter" data-max="4"><button class="btn-minus" aria-label="減少"><i class="mdi mdi-minus"></i></button><span class="count">0</span><button class="btn-plus" aria-label="增加"><i class="mdi mdi-plus"></i></button></div></div>
      <div class="ticket-row"><div class="area-name">VIP B區 全票</div><div class="status">已售完</div></div>
    </div>
  </div>
  <div class="price-group">
    <div class="group-title">一般區 NT$3,800</div>
    <div class="rows">
      <div class="ticket-row"><div class="area-name">A1區 全票</div><div class="status">剩餘 2</div><div class="counter" data-max="2"><button class="btn-minus" aria-label="減少"><i class="mdi mdi-minus"></i></button><span class="count">0</span><button class="btn-plus" aria-label="增加"><i class="mdi mdi-plus"></i></button></div></div>
      <div class="ticket-row"><div class="area-name">A2區 身障票</div><div class="status">熱賣中</div><div class="counter" data-max="4"><button class="btn-minus" aria-label="減少"><i class="mdi mdi-minus"></i></button><span class="count">0</span><button class="btn-plus" aria-label="增加"><i class="mdi mdi-plus"></i></button></div></div>
      <div class="ticket-row"><div class="area-name">B1區 全票</div><div class="status">剩餘 30</div><div class="counter" data-max="4"><button class="btn-minus" aria-label="減少"><i class="mdi mdi-minus"></i></button><span class="count">0</span><button class="btn-plus" aria-label="增加"><i class="mdi mdi-plus"></i></button></div></div>
    </div>
  </div>
  <h3>購票人資料</h3>
  <div class="v-input"><label for="f-name">購票人姓名</label><input id="f-name" type="text"></div>
  <div class="v-input"><label for="f-phone">手機號碼</label><input id="f-phone" type="tel"></div>
  <div class="v-input"><label for="f-email">電子郵件</label><input id="f-email" type="email"></div>
  <div class="v-input"><label for="f-id">身分證字號</label><input id="f-id" type="text"></div>
  <button class="v-btn" data-final>下一步</button>
  <p class="notice">注意事項：請於 10 分鐘內完成付款，付款逾時將自動取消訂單。付款方式請於下一步選擇。</p>
<div class="dialog" role="dialog"><h3>購票時間已到</h3><p>已超過購票時間，請重新選購。</p><button class="v-btn" data-final>確定</button></div>
</main>
<script src="mock.js"></script>

</body></html>
